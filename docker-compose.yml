version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskhub_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=TaskHub API
      - DEBUG=false
      - API_V1_STR=/api/v1
      - DATABASE_URL=postgresql+asyncpg://taskhub_user:taskhub_pass@db:5432/taskhub_db
      - REDIS_URL=redis://redis:6379/0
      - CACHE_ENABLED=true
      - JWT_SECRET_KEY=dev-secret-key-change-in-production-32chars
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: taskhub_postgres
    restart: always
    environment:
      POSTGRES_USER: taskhub_user
      POSTGRES_PASSWORD: taskhub_pass
      POSTGRES_DB: taskhub_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskhub_user -d taskhub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taskhub_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
